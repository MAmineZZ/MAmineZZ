<svg xmlns="http://www.w3.org/2000/svg" width="360" height="60" viewBox="0 0 360 60" role="img" aria-labelledby="title desc">
  <title id="title">Build mode on</title>
  <desc id="desc">Current arc: keep learning. A decorative status bar.</desc>
  <style>
    .pulse { animation: pulse 1.6s ease-in-out 3; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="359" height="59" rx="8" fill="#111724" stroke="#293349"/>
  <circle class="pulse" cx="20" cy="22" r="4" fill="#67e8d3"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing=".4">
    <text x="34" y="26" fill="#bffbef">BUILD MODE: ON</text>
    <text x="20" y="46" fill="#c3b5ff">CURRENT ARC: KEEP LEARNING</text>
  </g>
</svg>
